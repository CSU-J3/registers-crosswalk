name: sources-drift
# The third reference-integrity layer. hooks/check_refs.py asserts local ids exist in the sibling
# WORKING TREE; cross-repo.yml asserts they exist in COMMITTED state; this job asserts the pinned
# DOCUMENTS still hash the same at their canonical URLs — the only layer that reaches outside the
# four repos, and the only one that can go red because the world changed rather than because we did.
#
# Weekly, not per-push: a pin drifts on the publisher's schedule, not ours, and re-fetching every
# pinned document on every commit would be rude to the services and slow.
#
# No fetcher needs a key to re-fetch what it stored: govinfo, openfec and courtlistener all pin a
# key-free public URL and use their keys only for the metadata call at `add` time (see
# docs/operations.md). The secrets below are optional and unset. They stay wired so a future pin
# that DOES need one makes `check` exit 2 and fails this job — deliberately. A drift check that
# silently skipped the sources it couldn't reach would report green while telling you nothing, so
# there is no continue-on-error here.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
jobs:
  sources-drift:
    runs-on: ubuntu-latest
    # Every fetch has its own 60s timeout, but a long pin list against a slow service still adds
    # up, and a hung request would otherwise burn the full 6h default. A pin whose fetch fails is
    # fetched once more after a single 30s wait per run (`check_all`), so a run of timeouts now
    # costs twice what it did; 20 minutes leaves room for that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Re-fetch pinned documents and compare
        env:
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          OPENFEC_API_KEY: ${{ secrets.OPENFEC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python -m registers_crosswalk.pin check
