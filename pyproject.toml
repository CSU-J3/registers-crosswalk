[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "registers-crosswalk"
version = "0.1.0"
description = "Cross-register entity resolution and canonical shared determinations above CP, Sovereign, and VI."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/registers_crosswalk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
